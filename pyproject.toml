[project]
name = "lab-rotation"
version = "0.1.0"
description = "A panel of AI agents trains analysts to catch bad data"
requires-python = ">=3.12"
dependencies = [
    "band-sdk==9.1.0",
    "duckdb==2.0.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "runware>=0.5.24",
    "telem-sdk>=0.4.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a real sponsor service (skip with -k 'not live')"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
